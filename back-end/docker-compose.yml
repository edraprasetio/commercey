version: "3.8"

services:
  go-backend:
    build: .
    container_name: go-backend
    ports:
      - "5000:5000" # Map the backend port 5000 on your host to the container's port
    environment:
      - MONGO_URI=mongodb://mongo:27017
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017" # Expose MongoDB port to the host
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
    driver: local
